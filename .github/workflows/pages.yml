name: Deploy GitHub Pages
run-name: Verified audio library ${{ inputs.release_tag || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional published audio tag for the audit trail (all published manifests are verified)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve pinned OCF source commit
        id: source
        shell: bash
        run: echo "commit=$(python -c 'import json; print(json.load(open("site/source.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ocfproject-org/open-consciousness-functions
          ref: ${{ steps.source.outputs.commit }}
          fetch-depth: 0
          path: ocf-source
      - name: Verify the pinned source is on OCF main
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          git -C ocf-source fetch --no-tags origin main
          git -C ocf-source merge-base --is-ancestor "$SOURCE_COMMIT" origin/main || {
            echo "Pinned OCF source commit is not reachable from main." >&2
            exit 1
          }
      - name: Require the pinned documentation commit on OCF main
        working-directory: ocf-source
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main || {
            echo "Pinned OCF documentation commit is not reachable from main." >&2
            exit 1
          }
      - name: Install pinned OCF documentation dependencies
        run: python -m pip install -e ./ocf-source
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: node scripts/test_catalog.js
      - run: node scripts/test_docs.js
      - name: Rebuild from verified owner-published manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/refresh_catalog.py --output verified-catalog.json
          PYTHONPATH=ocf-source/scripts python -m ocf_tools.public_site_export \
            --source-commit "${{ steps.source.outputs.commit }}" \
            --output public-guide-export.json
          python scripts/build_public_site.py \
            --site-root site \
            --content-dir docs/website \
            --source-pin site/source.json \
            --guide-export public-guide-export.json \
            --catalog verified-catalog.json \
            --output verified-site
      - run: python scripts/validate_site.py verified-site
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser and accessibility acceptance on the exact build
        env:
          AUDIO_HEAD_SHA: ${{ github.sha }}
        run: npm run test:browser
      - name: Retain public-safe browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: verified-site/
          include-hidden-files: true
          retention-days: 30

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-site
          path: site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
